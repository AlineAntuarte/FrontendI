<!-- Aula 08 - Formulários -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>GUIA</title>
    <link rel="shortcut icon" href="../imagem/IconesNavegador/IconeLivro.png">
    <link rel="stylesheet" href="css/style08.css">
</head>

<body>
    <section class="impar">
        <h1 style="text-align: center; color: antiquewhite; padding-top: 20px;">GUIA</h1>
        <h2 style="text-align: center; color: antiquewhite; padding-top: 20px;">Agência de Empregos ADS</h2>
        <p style="text-align: center; margin-bottom: 30px;">
            Cadastre seu perfil profissional para encontrar as melhores vagas na área de TI.
        </p>

        <!-- ABERTURA DO FORMULÁRIO -->
        <form action="#" method="POST" enctype="multipart/form-data">

            <!-- Entrada 1: Texto -->
            <div>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>
            <br>

            <!-- Entrada 2: E-mail -->
            <div>
                <label for="email">E-mail Profissional:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>
            <br>

            <!-- Entrada 3: Tempo (Data) -->
            <div>
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>
            <br>

            <!-- Botão provisório para testar a validação do "required" -->
            <button type="submit">Enviar Cadastro</button>

        </form>
    </section>
</body>

</html>
