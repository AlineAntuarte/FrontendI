<!-- Aula 08 - Formulários -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>GUIA</title>
    <link rel="shortcut icon" href="../imagem/IconesNavegador/IconeLivro.png">
    <link rel="stylesheet" href="css/style08.css">
</head>

<body>
    <section class="formulario-flex">
        <h1 style="text-align: center; color: #4f4f4f; padding-top: 20px;">GUIA</h1>
        <h2 style="text-align: center; color: #4f4f4f; padding-top: 20px;">Agência de Empregos ADS</h2>
        <p style="text-align: center; margin-bottom: 30px;">
            Cadastre seu perfil profissional para encontrar as melhores vagas na área de TI.
        </p>

        <!-- ABERTURA DO FORMULÁRIO -->
        <form action="#" method="POST" enctype="multipart/form-data">

            <!-- Entrada 1: Texto -->
            <div>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>
            <br>

            <!-- Entrada 2: E-mail -->
            <div>
                <label for="email">E-mail Profissional:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>
            <br>

            <!-- Entrada 3: Tempo (Data) -->
            <div>
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>
            <br>

            <!--
            ### Entrada 4: Menu Suspenso (`<select>`)
            Para a vaga de interesse, vamos usar o `<select>`. O legal aqui é usar a tag `<optgroup>` que o professor mostrou nos slides para criar "categorias" de vagas (Desenvolvimento e Infraestrutura). Fica muito organizado!
            -->

            <!-- Entrada 4: Seleção (Select) -->
            <div>
                <label for="vaga">Vaga de Interesse:</label>
                <select id="vaga" name="vaga" required>
                    <!-- optgroup agrupa as opções visualmente, mas não pode ser clicado -->
                    <optgroup label="Desenvolvimento">
                        <option value="frontend">Desenvolvedor(a) Frontend</option>
                        <option value="backend">Desenvolvedor(a) Backend</option>
                    </optgroup>
                    <optgroup label="Infraestrutura">
                        <option value="redes">Analista de Redes</option>
                        <option value="bd">Administrador(a) de Banco de Dados</option>
                    </optgroup>
                </select>
            </div>
            <br>

            <!-- *Dica de Ouro:* O texto que o usuário vê é o que está entre as tags `<option>`, mas o que vai para o servidor de verdade é o que está no atributo `value="..."`.

            ### Entrada 5: Botão de Rádio (`type="radio"`)
            Sabe aquelas opções em que você só pode marcar uma (se marcar a outra, a primeira desmarca)? São os *radio buttons*. O segredo deles é que **todos precisam ter exatamente o mesmo `name`** para o navegador entender que eles fazem parte da mesma pergunta.-->

            <!-- Entrada 5: Seleção Única (Radio) -->
            <div>
                <label>Nível de Experiência:</label>
                <!-- Note que o name="senioridade" é igual em todos! -->
                <input type="radio" id="jr" name="senioridade" value="junior" checked>
                <label for="jr">Júnior</label>

                <input type="radio" id="pl" name="senioridade" value="pleno">
                <label for="pl">Pleno</label>

                <input type="radio" id="sr" name="senioridade" value="senior">
                <label for="sr">Sênior</label>
            </div>
            <br>

            <!-- *Dica:* O atributo `checked` no primeiro `<input>` faz com que ele já venha marcado por padrão.

            ### Entrada 6: Upload de Arquivo (`type="file"`)
            Como é uma agência de empregos, o candidato precisa mandar o currículo! É aqui que aquele `enctype="multipart/form-data"` que colocamos na tag `<form>` lá em cima brilha.-->

            <!-- Entrada 6: Arquivo (File) -->
            <div>
                <label for="curriculo">Envie seu Currículo (Apenas PDF):</label>
                <!-- O accept=".pdf" impede o usuário de mandar foto de gatinho no lugar do currículo -->
                <input type="file" id="curriculo" name="curriculo" accept=".pdf" required>
            </div>
            <br>

            <!-- ### Entrada 7: Caixas de Seleção (`type="checkbox"`)
            Diferente do *radio* (onde você só escolhe um), o *checkbox* permite que o usuário marque várias opções.
            Ideal para listar as ferramentas que a pessoa domina. -->


            <!-- Entrada 7: Múltipla Escolha (Checkbox) -->
            <div>
                <label>Quais ferramentas você domina?</label><br>
                <!-- Note que o name="habilidades" agrupa as opções no backend -->
                <input type="checkbox" id="hab_java" name="habilidades" value="java">
                <label for="hab_java">Java</label>

                <input type="checkbox" id="hab_git" name="habilidades" value="git">
                <label for="hab_git">Git</label>

                <input type="checkbox" id="hab_html" name="habilidades" value="html_css">
                <label for="hab_html">HTML5 e CSS3</label>

                <input type="checkbox" id="hab_hw" name="habilidades" value="hardware">
                <label for="hab_hw">Manutenção de Hardware</label>
            </div>
            <br>


            <!--  ### Entrada 8: Controle Numérico Deslizante (`type="range"`)
            Em vez de fazer o usuário digitar um número, o `range` cria uma barrinha de arrastar. Perfeito para a
            expectativa salarial. -->


            <!-- Entrada 8: Numérica Deslizante (Range) -->
            <div>
                <label for="salario">Pretensão Salarial Mínima (R$):</label><br>
                <!-- min e max definem os limites, step define de quanto em quanto o valor pula -->
                <input type="range" id="salario" name="salario" min="1500" max="15000" step="500" value="3000">
            </div>
            <br>

            <!-- 
            ### Entrada 9: Área de Texto Longo (`<textarea>`)
            A tag `<input type="text">` serve para coisas curtas (nome, cidade).
            Quando queremos um texto grande, usamos o `<textarea>`.
            Ele não usa o atributo `value`, o texto padrão (se houver) vai entre
            a abertura e o fechamento da tag.-->

            <!-- Entrada 9: Texto Longo (Textarea) -->
            <div>
                <label for="resumo">Resumo Profissional:</label><br>
                <!-- rows e cols definem o tamanho inicial da caixa na tela -->
                <textarea id="resumo" name="resumo" rows="5" cols="50"
                    placeholder="Fale sobre seu diferencial, sua autonomia em resolver problemas, otimizações de setup..."></textarea>
            </div>
            <br>


            <!-- ### Entrada 10: Seletor de Cores (`type="color"`)
            Essa é uma das entradas mais divertidas do HTML5. Ela abre a paleta de cores do próprio sistema operacional
            do usuário. -->


            <!-- Entrada 10: Cor (Color) -->
            <div>
                <label for="cor_cracha">Escolha uma cor de destaque para o seu crachá:</label>
                <!-- O value para cores sempre deve ser em Hexadecimal (ex: #000000) -->
                <input type="color" id="cor_cracha" name="cor_cracha" value="#366899">
            </div>
            <br>


            <!--   ### Entradas 11 e 12: Os Botões de Ação (`submit` e `reset`)
            Para finalizar, o formulário precisa de um botão para enviar os dados para o servidor e um botão (opcional,
            mas legal de ter) para apagar tudo caso a pessoa desista ou queira recomeçar.-->

            <!-- Entradas Finais: Botões de Ação -->
            <div>
                <input type="submit" value="Enviar Cadastro">
                <input type="reset" value="Limpar Formulário">
            </div>

            <!-- Com isso, você tem um formulário robusto, com **12 entradas**, passando por absolutamente todos os tipos
            exigidos nos slides da Aula 08. Vai digitando, testando a barrinha do *range*, clicando na cor para ver a
            paleta abrir, e validando tudo no navegador. -->
        </form>
    </section>
</body>

</html>
