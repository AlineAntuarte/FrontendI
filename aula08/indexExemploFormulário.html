<body>
    <p>Preencha o formulário abaixo:</p>

    <form action="indexExemploFormulário.html">
        <table>
            <tr>
                <td>Nome:</td>
                <td><input type="text" name="nome" value="Arliones Stevert Hoeller Junior" readonly></td>
            </tr>
            <tr>
                <td>Fale sobre você:</td>
                <td><textarea name="sobre_você" placeholder="Um texto sobre você" rows="10" cols="50"></textarea></td>
            </tr>
            <tr>
                <td>
                    Tem carro?
                </td>
                <td>
                    <input type="radio" name="carro" value="sim">Sim
                    <input type="radio" name="carro" value="nao">Não

                </td>
            </tr>
            <tr>
                <td>E-mail:</td>
                <td><input type="email" name="email" size="50"></td>
            </tr>
            <tr>
                <td>Senha:</td>
                <td><input type="password" name="senha"></td>
            </tr>
            <tr>
                <td>
                    Comida favorita:
                </td>
                <td>
                    <select name="comida" size="5">
                        <optgroup label="Carnes">
                            <option value="boi">Carne de boi</option>
                            <option value="frango">Carne de frango</option>
                        </optgroup>
                        <optgroup label="Massas">
                            <option value="macarrao">Macarrão</option>
                            <option value="nhoque">Nhoque</option>
                        </optgroup>
                        <optgroup label="Doces">
                            <option value="chocolate">Chocolate</option>
                            <option value="paçoca">Paçoca</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    Envie uma foto sua:
                </td>
                <td>
                    <input type="file" name="foto" accept="jpg">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Enviar">
                </td>
                <td>
                    <input type="reset" value="Limpar">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
